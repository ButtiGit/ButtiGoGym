name: ButtiGoGym Android APK

on:
  push:
    branches: [main, feature/health-connect-samsung-steps]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "Android SDK: ${ANDROID_HOME:-unset}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore complete Android source tree
        shell: bash
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            base64 -d pulse-build/source.tar.xz.b64 > pulse-build/source.tar.xz
            tar -xJf pulse-build/source.tar.xz
            rm pulse-build/source.tar.xz
          fi
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          find app/src/main -type f | sort

      - name: Resolve public exercise GIF references
        run: python3 tools/resolve_gifs.py

      - name: Include current plan as offline fallback
        run: cp workouts/plan.json app/src/main/assets/workout-plan.json

      - name: Publish Android source files to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app workouts/plan.json build.gradle.kts settings.gradle.kts gradle.properties gradle/wrapper .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "feat: add complete PULSE Android source v0.1"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Test streak and Health Connect integration
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK is valid
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          ls -lh "$APK"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: ButtiGoGym-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

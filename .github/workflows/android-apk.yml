name: ButtiGoGym Android APK

on:
  push:
    branches: [main, feature/workout-exercise-ui-daytime-reminders]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "Android SDK: ${ANDROID_HOME:-unset}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore complete Android source tree
        shell: bash
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            base64 -d pulse-build/source.tar.xz.b64 > pulse-build/source.tar.xz
            tar -xJf pulse-build/source.tar.xz
            rm pulse-build/source.tar.xz
          fi
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          find app/src/main -type f | sort

      - name: Bundle MIT anatomical template and body images
        run: python3 tools/build_muscle_map.py

      - name: Verify anatomical bundle
        shell: bash
        run: |
          test -s app/src/main/assets/muscle-map-regions.json
          test -s app/src/main/assets/male-front.webp
          test -s app/src/main/assets/male-back.webp
          test -s app/src/main/assets/MUSCLEMAP-LICENSE.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/src/main/assets/muscle-map-regions.json')
          maps = json.loads(p.read_text(encoding='utf-8'))['views']
          for side in ('front', 'back'):
              assert len(maps[side]) >= 20
              assert all(item['muscle'] and item['path'].startswith(('M', 'm')) for item in maps[side])
          print('Verified native anatomy:', {k: len(v) for k, v in maps.items()})
          PY

      - name: Verify ongoing session notification
        shell: bash
        run: |
          test -s app/src/main/java/it/pulse/workout/WorkoutTimerService.kt
          test -s app/src/main/res/drawable/ic_workout_notification.xml
          grep -q 'foregroundServiceType="specialUse"' app/src/main/AndroidManifest.xml
          grep -q 'permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'buttigogym_workout_timer_v2' app/src/main/java/it/pulse/workout/WorkoutTimerService.kt
          grep -q 'fun restarted(atMillis: Long)' app/src/main/java/it/pulse/workout/data/WorkoutData.kt
          test -s app/src/test/java/it/pulse/workout/data/WorkoutRestartTest.kt

      - name: Validate daytime reminder implementation
        shell: bash
        run: |
          test -s app/src/main/java/it/pulse/workout/reminders/ReminderClock.kt
          test -s app/src/main/java/it/pulse/workout/reminders/DaytimeReminders.kt
          test -s app/src/test/java/it/pulse/workout/reminders/ReminderClockTest.kt

      - name: Verify photo capture and recap resources
        shell: bash
        run: |
          test -s app/src/main/res/xml/session_photo_paths.xml
          test -s app/src/main/java/it/pulse/workout/ui/WorkoutPhotoAndRecap.kt
          test -s app/src/main/java/it/pulse/workout/ui/SessionPhotoAndRecap.kt

      - name: Verify new mascot launcher resources
        shell: bash
        run: |
          test -s app/src/main/res/drawable-nodpi/buttigogym_mascot.webp
          test -s app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          file app/src/main/res/drawable-nodpi/buttigogym_mascot.webp | grep -q "Web/P"
          ! grep -q 'monochrome' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Validate lean bulk plan
        run: python3 tools/validate_lean_bulk_plan.py

      - name: Resolve public exercise GIF references
        run: python3 tools/resolve_gifs.py

      - name: Include current plan as offline fallback
        run: cp workouts/plan.json app/src/main/assets/workout-plan.json

      - name: Publish Android source files to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app workouts/plan.json build.gradle.kts settings.gradle.kts gradle.properties gradle/wrapper .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "feat: add complete PULSE Android source v0.1"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Test workout, Health Connect and muscle analytics
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Prepare permanent signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUTTIGOGYM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            [[ -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
              echo "::error::Incomplete permanent signing secrets"
              exit 1
            }
            mkdir -p "$RUNNER_TEMP/buttigogym"
            chmod 700 "$RUNNER_TEMP/buttigogym"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/buttigogym/stable.jks"
            chmod 600 "$RUNNER_TEMP/buttigogym/stable.jks"
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              echo "::error::Configurare i quattro Secrets BUTTIGOGYM_* per pubblicare un APK aggiornabile. Non verranno più rilasciate build debug firmate con certificati temporanei."
              exit 1
            fi
            echo "::warning::Solo test: nessuna chiave permanente, questa build di branch NON può aggiornare un'app già installata."
            echo "permanent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile APK
        env:
          BUTTIGOGYM_SIGNING_FILE: ${{ runner.temp }}/buttigogym/stable.jks
          BUTTIGOGYM_STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          BUTTIGOGYM_KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          BUTTIGOGYM_KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.permanent }}" == "true" ]]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Verify APK is valid
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' -type f | head -1)
          test -n "$APK" && test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > "$RUNNER_TEMP/apk_badging.txt"
          grep -q "^package:" "$RUNNER_TEMP/apk_badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: ButtiGoGym-Android-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

name: Publish stable signed ButtiGoGym release

# Release can be triggered by a stable tag (legacy path) or an explicitly
# titled merge on main. No regular commit is ever released.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read

concurrency:
  group: buttigogym-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-stable]'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate requested release and main ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid app versionName"; exit 1; }
          TAG="v$VERSION"
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -1)
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || exit 1
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "$TAG" ]] || {
              echo "::error::Tag and Gradle version mismatch"; exit 1; }
          else
            # Only the specifically approved squash/merge commit may publish.
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
            [[ "$GITHUB_EVENT_NAME" == "push" ]] || exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release commit not part of main"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; no silent overwrite"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare offline assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_muscle_map.py
          python3 tools/validate_lean_bulk_plan.py
          python3 tools/resolve_gifs.py
          cp workouts/plan.json app/src/main/assets/workout-plan.json
      - name: Test and lint before release
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Restore persistent signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUTTIGOGYM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo "::error::Missing permanent signing secrets"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stable-signing.jks"
          chmod 600 "$RUNNER_TEMP/stable-signing.jks"
      - name: Assemble signed release
        env:
          BUTTIGOGYM_SIGNING_FILE: ${{ runner.temp }}/stable-signing.jks
          BUTTIGOGYM_STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          BUTTIGOGYM_KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          BUTTIGOGYM_KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signer, package, version and upgrade path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "$SOURCE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SOURCE" > "$RUNNER_TEMP/newcert.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$SOURCE" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='it.pulse.workout'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='$RELEASE_VERSION'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='$RELEASE_VERSION_CODE'" "$RUNNER_TEMP/badging.txt"
          mkdir -p "$RUNNER_TEMP/old"
          PREVIOUS_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          PREVIOUS_NAME="ButtiGoGym-${PREVIOUS_TAG#v}-STABLE.apk"
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" \
            -p "$PREVIOUS_NAME" -D "$RUNNER_TEMP/old"
          PREVIOUS="$RUNNER_TEMP/old/$PREVIOUS_NAME"
          test -s "$PREVIOUS"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$PREVIOUS" > "$RUNNER_TEMP/oldcert.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$PREVIOUS" > "$RUNNER_TEMP/oldbadging.txt"
          grep -Fq "package: name='it.pulse.workout'" "$RUNNER_TEMP/oldbadging.txt"
          PREVIOUS_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/oldbadging.txt" | head -1)
          [[ "$PREVIOUS_CODE" =~ ^[1-9][0-9]*$ && "$RELEASE_VERSION_CODE" -gt "$PREVIOUS_CODE" ]] || {
            echo "::error::versionCode must increase from the previous stable release"; exit 1; }
          NEW_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/newcert.txt" | head -1)
          OLD_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/oldcert.txt" | head -1)
          [[ -n "$NEW_SHA" && "$NEW_SHA" == "$OLD_SHA" ]] || {
            echo "::error::Release signer not compatible with previous stable build"; exit 1; }
          mkdir -p "$RUNNER_TEMP/release"
          cp "$SOURCE" "$RUNNER_TEMP/release/ButtiGoGym-$RELEASE_VERSION-STABLE.apk"
          (cd "$RUNNER_TEMP/release" && sha256sum *.apk > "ButtiGoGym-$RELEASE_VERSION-STABLE.apk.sha256")
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/ButtiGoGym-$RELEASE_VERSION-STABLE.apk" \
            "$RUNNER_TEMP/release/ButtiGoGym-$RELEASE_VERSION-STABLE.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ButtiGoGym $RELEASE_VERSION" \
            --notes "ButtiGoGym 1.9.0: nuova palette coerente verde/salvia anche in modalità scura; Home focalizzata sull’allenamento; mascotte compatta; inserimento rapido di peso e ripetizioni, passi regolabili, richiami dell’ultima serie, RIR facoltativo e modalità guidata selezionabile. Salvataggio sempre esplicito, recupero e annullamento mantenuti. Firma confrontata con la release stabile precedente per l’aggiornamento dall’app."

name: Publish signed ButtiGoGym GitHub Release

# Nessuna APK o Release viene generata dai commit del branch di sviluppo.
# Pubblicazione esplicita: solo un tag stabile vX.Y.Z sul commit presente in main.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag, version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Use stable tags like v1.0.0, no prereleases"
            exit 1
          }
          VERSION="${TAG#v}"
          grep -Fq "versionName = \"$VERSION\"" app/build.gradle.kts || {
            echo "::error::Gradle versionName must match tag $TAG"
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Only commits already on main can be released"
            exit 1
          }

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare offline assets
        shell: bash
        run: |
          python3 tools/build_muscle_map.py
          python3 tools/validate_lean_bulk_plan.py
          python3 tools/resolve_gifs.py
          cp workouts/plan.json app/src/main/assets/workout-plan.json

      - name: Test before release
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Restore persistent signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUTTIGOGYM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" &&
             -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo "::error::All four BUTTIGOGYM signing secrets are required"
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stable-signing.jks"
          chmod 600 "$RUNNER_TEMP/stable-signing.jks"

      - name: Assemble signed release APK
        env:
          BUTTIGOGYM_SIGNING_FILE: ${{ runner.temp }}/stable-signing.jks
          BUTTIGOGYM_STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          BUTTIGOGYM_KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          BUTTIGOGYM_KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "$SOURCE"
          mkdir -p "$RUNNER_TEMP/releases"
          DEST="$RUNNER_TEMP/releases/ButtiGoGym-$VERSION-STABLE.apk"
          cp "$SOURCE" "$DEST"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$DEST"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$DEST" \
            > "$RUNNER_TEMP/releases/apk-badging.txt"
          grep -Fq "package: name='it.pulse.workout'" \
            "$RUNNER_TEMP/releases/apk-badging.txt"
          grep -Fq "versionName='$VERSION'" \
            "$RUNNER_TEMP/releases/apk-badging.txt"
          (cd "$RUNNER_TEMP/releases" &&
            sha256sum "ButtiGoGym-$VERSION-STABLE.apk" > "ButtiGoGym-$VERSION-STABLE.apk.sha256")
          rm "$RUNNER_TEMP/releases/apk-badging.txt"

      - name: Publish stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT="$RUNNER_TEMP/releases"
          gh release create "$GITHUB_REF_NAME" \
            "$ROOT/ButtiGoGym-$VERSION-STABLE.apk" \
            "$ROOT/ButtiGoGym-$VERSION-STABLE.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ButtiGoGym $VERSION" \
            --verify-tag \
            --generate-notes

name: ButtiGoGym V1.0 APK (feature branch)

# Explicit V1.0 packaging only. Never runs when main changes.
on:
  push:
    branches:
      - feature/v1-phase1-complete-backup
    paths:
      - .github/workflows/v1-build-apk.yml
      - app/build.gradle.kts

permissions:
  contents: read

jobs:
  package-v1:
    name: Verify and package ButtiGoGym 1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify exact version and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/v1-phase1-complete-backup"
          grep -Fq 'versionName = "1.0.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 18' app/build.gradle.kts

      - name: Prepare offline assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_muscle_map.py
          python3 tools/validate_lean_bulk_plan.py
          python3 tools/resolve_gifs.py
          cp workouts/plan.json app/src/main/assets/workout-plan.json

      - name: Run all JVM tests before packaging
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Restore stable signing if configured
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUTTIGOGYM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            [[ -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
              echo "::error::Signing secrets are incomplete"
              exit 1
            }
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/buttigogym-stable.jks"
            chmod 600 "$RUNNER_TEMP/buttigogym-stable.jks"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Permanent key not configured; debug APK is installable but cannot update an app signed by a different key without uninstalling."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile installable APK
        shell: bash
        env:
          BUTTIGOGYM_SIGNING_FILE: ${{ runner.temp }}/buttigogym-stable.jks
          BUTTIGOGYM_STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          BUTTIGOGYM_KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          BUTTIGOGYM_KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.variant }}" == "release" ]]; then
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Verify, name APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          TYPE="${{ steps.signing.outputs.variant }}"
          APK="app/build/outputs/apk/$TYPE/app-$TYPE.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='it.pulse.workout'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='1.0.0'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='18'" "$RUNNER_TEMP/badging.txt"
          mkdir -p "$RUNNER_TEMP/v1-artifact"
          if [[ "$TYPE" == "release" ]]; then
            NAME="ButtiGoGym-v1.0.0-signed.apk"
          else
            NAME="ButtiGoGym-v1.0.0-debug.apk"
          fi
          cp "$APK" "$RUNNER_TEMP/v1-artifact/$NAME"
          (cd "$RUNNER_TEMP/v1-artifact" && sha256sum "$NAME" > "$NAME.sha256")
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APK_TYPE=$TYPE" >> "$GITHUB_ENV"
          ls -lh "$RUNNER_TEMP/v1-artifact"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ButtiGoGym-v1.0.0-${{ env.APK_TYPE }}
          path: ${{ runner.temp }}/v1-artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo '## ButtiGoGym 1.0.0'
            echo "- Variant: **$APK_TYPE**"
            echo "- APK: `$APK_NAME`"
            echo '- Git source: feature/v1-phase1-complete-backup'
            echo '- Tests: passed, APK signature and version: verified'
            if [[ "$APK_TYPE" == "debug" ]]; then
              echo '- ⚠️ Debug signing: not guaranteed to update an existing installation. Back up your data before any uninstall.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

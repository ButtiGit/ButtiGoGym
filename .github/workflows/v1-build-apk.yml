name: ButtiGoGym 1.1.0 signed release candidate

# Pre-flight candidate: triggered only by version/workflow changes on feature.
# Builds SIGNED APK for QA, never publishes a stable GitHub Release.
on:
  push:
    branches:
      - feature/v1-phase1-complete-backup
    paths:
      - app/build.gradle.kts
      - .github/workflows/v1-build-apk.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare offline assets and validate plan
        run: |
          set -euo pipefail
          python3 tools/build_muscle_map.py
          python3 tools/validate_lean_bulk_plan.py
          python3 tools/resolve_gifs.py
          cp workouts/plan.json app/src/main/assets/workout-plan.json
      - name: Compile, run tests and Android lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Validate version bump and signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUTTIGOGYM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'versionName = "1.1.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 19' app/build.gradle.kts
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo "::error::Permanent signing secrets unavailable: cannot publish an update"
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stable.jks"
          chmod 600 "$RUNNER_TEMP/stable.jks"
      - name: Assemble signed candidate
        env:
          BUTTIGOGYM_SIGNING_FILE: ${{ runner.temp }}/stable.jks
          BUTTIGOGYM_STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          BUTTIGOGYM_KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          BUTTIGOGYM_KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify candidate APK and signing continuity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/new-certificate.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > "$RUNNER_TEMP/new-badging.txt"
          grep -Fq "package: name='it.pulse.workout'" "$RUNNER_TEMP/new-badging.txt"
          grep -Fq "versionName='1.1.0'" "$RUNNER_TEMP/new-badging.txt"
          grep -Fq "versionCode='19'" "$RUNNER_TEMP/new-badging.txt"
          # Compare with the last SIGNED app-release APK from main (Oct 13).
          mkdir -p "$RUNNER_TEMP/previous"
          gh run download 38365098239 --repo "$GITHUB_REPOSITORY" -n ButtiGoGym-Android-APK -D "$RUNNER_TEMP/previous"
          PREVIOUS=$(find "$RUNNER_TEMP/previous" -type f -name "app-release.apk" -print -quit)
          test -s "$PREVIOUS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$PREVIOUS" > "$RUNNER_TEMP/old-certificate.txt"
          NEW_FINGERPRINT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-certificate.txt" | head -1)
          OLD_FINGERPRINT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/old-certificate.txt" | head -1)
          test -n "$NEW_FINGERPRINT" && test "$NEW_FINGERPRINT" = "$OLD_FINGERPRINT" || {
            echo "::error::Signing certificate changed! In-place update unsafe"
            exit 1
          }
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$PREVIOUS" > "$RUNNER_TEMP/old-badging.txt"
          grep -Fq "package: name='it.pulse.workout'" "$RUNNER_TEMP/old-badging.txt"
          grep -Fq "versionCode='18'" "$RUNNER_TEMP/old-badging.txt"
          echo "Signer SHA-256: $NEW_FINGERPRINT"
          echo "Candidate APK: same signing certificate as previous signed main APK"
          mkdir -p "$RUNNER_TEMP/candidate"
          cp "$APK" "$RUNNER_TEMP/candidate/ButtiGoGym-1.1.0-candidate.apk"
          (cd "$RUNNER_TEMP/candidate" && sha256sum *.apk > SHA256SUMS)
      - name: Upload signed QA candidate
        uses: actions/upload-artifact@v4
        with:
          name: ButtiGoGym-1.1.0-signed-candidate
          path: ${{ runner.temp }}/candidate/*
          retention-days: 14
          if-no-files-found: error

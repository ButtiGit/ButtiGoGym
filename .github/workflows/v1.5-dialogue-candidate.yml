name: ButtiGoGym 1.5 - dialogue minimal candidate

on:
  push:
    branches: [feature/v1.5-dialogue-minimal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare offline assets
        run: |
          python3 tools/build_muscle_map.py
          python3 tools/validate_lean_bulk_plan.py
          python3 tools/resolve_gifs.py
          cp workouts/plan.json app/src/main/assets/workout-plan.json
      - name: Verify all 11 embedded mascot resources
        run: |
          for pose in home ready rest done abs chest back arms legs shoulders forearms; do
            test -s "app/src/main/res/drawable-nodpi/mascot_${pose}.webp"
          done
      - name: Test and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Restore stable signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUTTIGOGYM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" &&
             -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || exit 1
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stable-signing.jks"
          chmod 600 "$RUNNER_TEMP/stable-signing.jks"
      - name: Assemble signed candidate
        env:
          BUTTIGOGYM_SIGNING_FILE: ${{ runner.temp }}/stable-signing.jks
          BUTTIGOGYM_STORE_PASSWORD: ${{ secrets.BUTTIGOGYM_STORE_PASSWORD }}
          BUTTIGOGYM_KEY_ALIAS: ${{ secrets.BUTTIGOGYM_KEY_ALIAS }}
          BUTTIGOGYM_KEY_PASSWORD: ${{ secrets.BUTTIGOGYM_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify update compatibility with 1.4.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/new.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > "$RUNNER_TEMP/new-badging.txt"
          grep -Fq "package: name='it.pulse.workout'" "$RUNNER_TEMP/new-badging.txt"
          grep -Fq "versionName='1.5.0'" "$RUNNER_TEMP/new-badging.txt"
          grep -Fq "versionCode='23'" "$RUNNER_TEMP/new-badging.txt"
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download v1.4.0 -p 'ButtiGoGym-1.4.0-STABLE.apk' -D "$RUNNER_TEMP/previous" --repo "$GITHUB_REPOSITORY"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/previous/ButtiGoGym-1.4.0-STABLE.apk" > "$RUNNER_TEMP/old.txt"
          NEW_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new.txt" | head -1)
          OLD_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/old.txt" | head -1)
          [[ -n "$NEW_SHA" && "$NEW_SHA" == "$OLD_SHA" ]] || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ButtiGoGym-1.5-signed-candidate
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

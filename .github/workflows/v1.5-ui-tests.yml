name: ButtiGoGym 1.5 UI verification
on:
  push:
    branches: [feature/v1.5-dialogue-minimal]
  pull_request:
    paths: ['app/**', '.github/workflows/v1.5-ui-tests.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile and run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test dialogue and single-input workout
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/verify_dialogue_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ButtiGoGym-1.5-ui-verification
          path: |
            app/build/reports/androidTests/
            app/build/reports/tests/
            ui-screenshots/

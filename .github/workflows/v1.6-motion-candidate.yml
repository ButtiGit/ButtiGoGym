name: ButtiGoGym 1.6 motion and interaction checks
on:
  push:
    branches: [feature/v1.6-lively-microinteractions]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Prepare offline assets
        run: |
          python3 tools/build_muscle_map.py
          python3 tools/validate_lean_bulk_plan.py
          python3 tools/resolve_gifs.py
          cp workouts/plan.json app/src/main/assets/workout-plan.json
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload debug APK for review
        uses: actions/upload-artifact@v4
        with:
          name: ButtiGoGym-1.6-debug-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
